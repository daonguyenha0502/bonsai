name: Release

permissions:
  contents: write

on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

env:
  CARGO_DIST_VERSION: "0.32.0"

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-22.04

    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ github.event_name == 'push' && github.ref_name || '' }}
      tag-flag: ${{ github.event_name == 'push' && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ github.event_name == 'push' }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install cargo-dist
        shell: bash
        run: |
          set -euo pipefail

          curl --proto '=https' \
            --tlsv1.2 \
            -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" \
            | sh

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo-dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - name: Run dist plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            dist host \
              --steps=create \
              --tag="${{ github.ref_name }}" \
              --output-format=json \
              > plan-dist-manifest.json
          else
            dist plan \
              --output-format=json \
              > plan-dist-manifest.json
          fi

          echo "dist ran successfully"
          cat plan-dist-manifest.json

          {
            echo 'manifest<<EOF'
            cat plan-dist-manifest.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload dist manifest
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: Build (${{ join(matrix.targets, ', ') }})

    needs:
      - plan

    if: >-
      ${{
        fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null
        &&
        (
          needs.plan.outputs.publishing == 'true'
          ||
          fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload'
        )
      }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}

    runs-on: ${{ matrix.runner }}

    container: ${{ matrix.container && matrix.container.image || null }}

    permissions:
      attestations: write
      contents: read
      id-token: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json

    steps:
      - name: Enable Windows long paths
        run: |
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        if: ${{ matrix.container }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' \
              --tlsv1.2 \
              -sSf \
              https://sh.rustup.rs \
              | sh -s -- -y

            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install cargo-dist
        run: ${{ matrix.install_dist.run }}

      - name: Fetch dist manifest
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}

      - name: Build artifacts
        shell: bash
        run: |
          set -euo pipefail

          dist build \
            ${{ needs.plan.outputs.tag-flag }} \
            --print=linkage \
            --output-format=json \
            ${{ matrix.dist_args }} \
            > dist-manifest.json

          echo "dist ran successfully"

      - name: Prepare artifact list
        id: cargo-dist
        shell: bash
        run: |
          set -euo pipefail

          {
            echo 'paths<<EOF'
            dist print-upload-files-from-manifest \
              --manifest dist-manifest.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    name: Build global artifacts

    needs:
      - plan
      - build-local-artifacts

    runs-on: ubuntu-22.04

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download cargo-dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - name: Make dist executable
        run: chmod +x ~/.cargo/bin/dist

      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Build global artifacts
        id: cargo-dist
        shell: bash
        run: |
          set -euo pipefail

          dist build \
            ${{ needs.plan.outputs.tag-flag }} \
            --output-format=json \
            --artifacts=global \
            > dist-manifest.json

          echo "dist ran successfully"

          {
            echo 'paths<<EOF'
            jq --raw-output '.upload_files[]' dist-manifest.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload global artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  host:
    name: Publish release

    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts

    if: >-
      ${{
        always()
        &&
        needs.plan.result == 'success'
        &&
        needs.plan.outputs.publishing == 'true'
        &&
        (
          needs.build-global-artifacts.result == 'skipped'
          ||
          needs.build-global-artifacts.result == 'success'
        )
        &&
        (
          needs.build-local-artifacts.result == 'skipped'
          ||
          needs.build-local-artifacts.result == 'success'
        )
      }}

    runs-on: ubuntu-22.04

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download cargo-dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - name: Make dist executable
        run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - name: Upload release artifacts
        id: host
        shell: bash
        run: |
          set -euo pipefail

          dist host \
            ${{ needs.plan.outputs.tag-flag }} \
            --steps=upload \
            --steps=release \
            --output-format=json \
            > dist-manifest.json

          echo "artifacts uploaded and released successfully"

          cat dist-manifest.json

          {
            echo 'manifest<<EOF'
            cat dist-manifest.json
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Upload dist manifest
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts/
          merge-multiple: true

      - name: Cleanup manifests
        run: |
          rm -f artifacts/*-dist-manifest.json

      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: >-
            ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease
                && '--prerelease'
                || '' }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
          RELEASE_COMMIT: ${{ github.sha }}

        shell: bash
        run: |
          set -euo pipefail

          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          gh release create \
            "${{ needs.plan.outputs.tag }}" \
            --target "$RELEASE_COMMIT" \
            $PRERELEASE_FLAG \
            --title "$ANNOUNCEMENT_TITLE" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            artifacts/*
